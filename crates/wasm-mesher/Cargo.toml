[package]
name = "voxelize-wasm-mesher"
version = "1.0.0"
edition = "2021"
description = "WebAssembly wrapper for voxelize-mesher"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voxelize-mesher = { path = "../mesher" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Kept in release builds too. A trap here surfaces in the browser as a bare
# "RuntimeError: unreachable" with no file, line, or message, and the worker is
# poisoned for good afterwards — the mesher can go completely dark and the only
# symptom is a world that renders no terrain at all.
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true

# `wasm-pack build --dev` (the watch loop) compiles this profile. opt-level 1
# keeps rebuilds fast and incremental while making the meshing hot loops
# usable in the browser, unlike the default opt-level 0.
[profile.dev]
opt-level = 1

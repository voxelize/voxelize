# Standalone workspace: wasm-pack builds this crate with its own profiles,
# outside the root cargo workspace.
[workspace]

[package]
name = "voxelize-wasm-mesher"
version = "3.0.0"
edition = "2021"
description = "WebAssembly wrapper for voxelize-mesher"
license = "MIT"
repository = "https://github.com/voxelize/voxelize"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
voxelize-mesher = { path = "../mesher", version = "3.0.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Kept in release builds too. A trap here surfaces in the browser as a bare
# "RuntimeError: unreachable" with no file, line, or message, and the worker is
# poisoned for good afterwards — the mesher can go completely dark and the only
# symptom is a world that renders no terrain at all.
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true

# `wasm-pack build --dev` (the watch loop) compiles this profile, and what it
# builds is the mesher a developer plays with: every local remesh in a dev
# session runs it. At opt-level 1 it meshed a dense section in 590 ms where
# the release build took 170 (and the same change measured 3x slower there
# than here), so an edit that felt slow in dev said nothing about the code.
# Fully optimized, the watch build costs a few seconds more per mesher edit
# and stays close to release; it only skips `wasm-opt`. The mesher's own
# assertions still run where its tests do, in the native build.
[profile.dev]
opt-level = 3
debug-assertions = false
overflow-checks = false

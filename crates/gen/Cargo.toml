[package]
name = "voxelize-gen"
version = "3.0.0"
edition = "2021"
description = "Deterministic, content-free world generation mechanisms for Voxelize: seed streams, bit-stable noise, compiled field programs, climate partitions, surface rules, carvers, hydrology, plan-sliced structures, chunk-stage adapters, and generation diagnostics."
license = "MIT"
repository = "https://github.com/voxelize/voxelize"

[features]
default = []
# The `landscape` generator (docs/landscape.md) stays behind this non-default
# feature until its design is frozen, so no consumer compiles or links it.
# It must never enable a feature on a shared dependency (serde_json
# `float_roundtrip`, `arbitrary_precision`, `preserve_order`): Cargo unifies
# features across a consumer's whole build, so that would change the
# consumer's own parsing. Optional dependencies join it with the first code
# that uses them.
unstable-landscape = ["dep:ryu", "dep:serde_path_to_error"]
# The landscape test kit: `assert_no_libm!` and the determinism suite for
# game crates; the landform, province and structure suites join as the
# plugin kinds they test land.
kit = ["unstable-landscape"]
# Deterministic work counters for the budget gate: cost only, never output.
gen-counters = ["unstable-landscape"]

[dependencies]
voxelize = { path = "../..", version = "3.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.13", features = ["serde"] }
hashbrown = "0.14"
png = "0.17"
# The landscape spec's own number path (docs/landscape.md, section 2.4.3):
# a pinned float formatter for the canonical writer, and path-qualified
# deserialization errors. Neither enables a feature on a shared dependency.
ryu = { version = "1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }

[dev-dependencies]
rayon = "1.10"
criterion = { version = "0.5", features = ["html_reports"] }
# The showcase example's server (an in-engine world serving a preset).
actix-web = "4"

[[bench]]
name = "gen_bench"
harness = false

[[bench]]
name = "landscape_kernel"
harness = false
required-features = ["unstable-landscape"]

[[test]]
name = "landscape_kernel"
required-features = ["unstable-landscape"]

[[example]]
name = "landscape_profiles"
required-features = ["unstable-landscape"]

[[example]]
name = "landscape_render"
required-features = ["unstable-landscape"]

[[example]]
name = "export_preset"
required-features = ["unstable-landscape"]

[[example]]
name = "showcase"
required-features = ["unstable-landscape"]

# A game's landform in one file (docs/landscape.md, section 9).
[[example]]
name = "sinkhole"
required-features = ["unstable-landscape", "kit"]

[[test]]
name = "landscape_spec"
required-features = ["unstable-landscape"]

[[test]]
name = "landscape_fields"
required-features = ["unstable-landscape"]

[[test]]
name = "landscape_facts"
required-features = ["unstable-landscape"]

[[test]]
name = "landscape_identity"
required-features = ["unstable-landscape"]

[[test]]
name = "landscape_writer"
required-features = ["unstable-landscape"]

[[test]]
name = "landscape_determinism"
required-features = ["unstable-landscape", "kit"]

[[test]]
name = "landscape_dag"
required-features = ["unstable-landscape", "kit"]

[[test]]
name = "landscape_compose"
required-features = ["unstable-landscape", "kit"]

[[test]]
name = "landscape_spawn"
required-features = ["unstable-landscape", "kit"]

# `cargo test` runs this example's own tests (its SHA-256 known answers and
# the budget gate's rules), which it would otherwise only build.
[[example]]
name = "walk_bench"
test = true

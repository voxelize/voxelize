[package]
name = "voxelize-mesher"
version = "3.0.0"
edition = "2021"
description = "Meshing logic for Voxelize"
license = "MIT"
repository = "https://github.com/voxelize/voxelize"

[lib]
crate-type = ["lib"]

[dependencies]
voxelize-core = { path = "../core", version = "3.0.0" }
hashbrown = { version = "0.14.3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

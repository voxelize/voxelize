[package]
name = "platform-game-server"
description = "Authoritative game server: hosts persistent worlds on the Voxelize engine."
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "game-server"
path = "src/main.rs"

[dependencies]
platform-content.workspace = true
platform-ticket.workspace = true
platform-worldgen.workspace = true
voxelize.workspace = true
serde.workspace = true
serde_json.workspace = true
specs = "0.20.0"
log.workspace = true
actix-web.workspace = true
actix-cors.workspace = true
# Fetches land claims from the backend's internal API (plain HTTP on the
# private network; no TLS stack needed).
awc = { version = "3", default-features = false }

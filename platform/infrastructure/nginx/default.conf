# Edge router for the development stack: one origin for the API and the
# game server, so the browser needs no CORS for either.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ws:10m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Business API (Laravel, php-fpm)
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass api:9000;
    }

    # Realtime game protocol (game server)
    location /ws/ {
        limit_conn ws 4;
        proxy_pass http://game-server:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /platform/info { proxy_pass http://game-server:4000; }
    location = /game/health   { proxy_pass http://game-server:4000/health; }

    # The internal server-to-server API is never routed from outside.
    location /api/internal/ { return 404; }

    location / {
        default_type application/json;
        return 200 '{"service":"platform","api":"/api/v1","ws":"/ws/"}';
    }
}

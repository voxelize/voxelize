# Gateway for player-made worlds: wss://w-<id>.<domain>/ws/ reaches the
# game server of world `w_<id>`, a container named `world-<id>` that
# infrastructure/worlds/host-worlds.sh keeps running. Set the backend's
# WORLDS_URL_TEMPLATE to wss://w-{id}.<domain>/ws/ to match.

server {
    listen 80;
    # Keys are "w_" and ten lower-case letters or digits.
    server_name "~^w-(?<world_id>[a-z0-9]{10})\.";

    # Docker's DNS: containers come and go, so names are looked up afresh.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /ws/ {
        limit_conn ws 4;
        proxy_pass http://world-$world_id:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /health { proxy_pass http://world-$world_id:4000/health; }

    # Nothing else of a world's server is public (metrics stay private).
    location / { return 404; }
}

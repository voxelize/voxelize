# Scrapes the game server and the backend every 15 s (compose profile
# "observability"). Both endpoints sit on the private network only.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: game-server
    metrics_path: /platform/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["game-server:4000"]

  - job_name: api
    metrics_path: /api/internal/v1/metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/service_token
    static_configs:
      - targets: ["nginx:8081"]

groups:
  - name: platform
    rules:
      - alert: GameTicksSlow
        expr: max by (world) (platform_tick_seconds) > 0.25
        for: 2m
        annotations:
          summary: "{{ $labels.world }}: a game tick took over 250 ms"
      - alert: WorldNotReporting
        expr: platform_world_report_age_seconds > 120
        for: 1m
        annotations:
          summary: "{{ $labels.world }} ({{ $labels.dimension }}) has not reported for 2 minutes"
      - alert: PluginSwitchedOff
        expr: platform_plugins_disabled > 0
        annotations:
          summary: "A server plugin failed too often and was switched off"
      - alert: ManyRefusedIntents
        expr: sum(rate(platform_intents_total{result=~"too_fast|out_of_reach"}[5m])) > 5
        for: 5m
        annotations:
          summary: "Many too_fast / out_of_reach refusals: a client may be cheating"
      - alert: EconomyFrozen
        expr: platform_economy_frozen > 0
        annotations:
          summary: "The ledger did not balance: money is frozen until an administrator releases it (admin panel, Economy)"
      - alert: ReportsPilingUp
        expr: platform_reports{status="open"} > 20
        for: 30m
        annotations:
          summary: "More than 20 player reports wait for a moderator"

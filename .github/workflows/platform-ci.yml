name: Platform CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Content pack validation, world generation, tickets and the game server.
  # The platform depends on the engine, so it runs on every change.
  rust:
    name: platform rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform -> ../target

      - name: Format
        working-directory: platform
        # Only the platform packages: the engine (a path dependency) keeps
        # its own formatting.
        run: cargo fmt -p platform-content -p platform-ticket -p platform-worldgen -p platform-game-server --check

      - name: Test
        working-directory: platform
        run: cargo test --workspace --locked

  laravel:
    name: platform api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend/laravel-api
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: platform_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, pdo_sqlite, bcmath
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests (SQLite)
        run: php artisan test

      - name: Tests (MySQL 8, including concurrency)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: platform_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php vendor/bin/phpunit

  stack:
    name: platform stack config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose
        working-directory: platform
        run: |
          cp .env.example .env
          sed -i 's/^\([A-Z_]*\(KEY\|PASSWORD\|SECRETS\|SECRET\)\)=$/\1=ci-placeholder-value-0123456789abcdef/' .env
          docker compose config --quiet

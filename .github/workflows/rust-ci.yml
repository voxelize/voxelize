name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine must not know what any game built on it contains. Node
  # builtins only, so it needs no install; well under a second.
  engine-boundary:
    name: engine boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gate tests
        run: node --test scripts/engine-boundary/check.test.mjs

      - name: Engine boundary
        run: node scripts/engine-boundary/check.mjs

  test:
    name: cargo test --lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # build.rs compiles messages.proto via prost-build, which shells out to protoc.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # Honors the pinned channel in rust-toolchain.toml (stable).
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Authoritative Voxelize library test command, run from the workspace root
      # so it exercises the `voxelize` crate whose lib downstream consumers pin.
      - name: Run library tests
        run: cargo test --lib

  # `cargo test --lib` above runs only the root `voxelize` package, so the
  # generator crate's tests (including the v1 goldens that pin its output for
  # every world built on it) need their own job. Release, because generation
  # tests walk real chunks.
  gen:
    name: cargo test -p voxelize-gen --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # voxelize-gen depends on voxelize, whose build.rs shells out to protoc.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Includes walk_bench's own tests (`test = true` in its manifest).
      - name: Run generator tests
        run: cargo test -p voxelize-gen --release

      # The unstable landscape module and its kit, which a default build
      # never compiles.
      - name: Run landscape tests
        run: cargo test -p voxelize-gen --release --features unstable-landscape,kit,gen-counters

      # The kernel bench is not run here (timings need a quiet host), but it
      # must keep compiling.
      - name: Build landscape benches
        run: cargo bench -p voxelize-gen --features unstable-landscape,kit --no-run

      # Proves the walk benchmark still runs; timings are reported, never
      # gated here (the wall-clock gate needs GEN_BUDGET_GATE=1 on a bench host).
      - name: Walk benchmark smoke
        run: cargo run -p voxelize-gen --release --example walk_bench -- --quick --workers 1

      # The plain preset's JSON twin must match its Rust builder.
      - name: Landscape preset twin is current
        run: cargo run -p voxelize-gen --release --features unstable-landscape --example export_preset -- --check

      # The deterministic half of the budget gate: the plain walk's work
      # counters (single worker) against budgets/plain.json, enforced on any
      # machine. Wall-clock rows are reported only.
      - name: Landscape work counters gate
        run: cargo run -p voxelize-gen --release --features unstable-landscape,gen-counters --example walk_bench -- --fixtures plain --workloads spiral --workers 1 --gate crates/gen/budgets/plain.json

      # The same gate for the plugin system: the proving preset (the kit's
      # test landforms and the sinkhole example) on walks whose cold first
      # touches solve plans and admit Field tiles, against budgets/proving.json.
      - name: Landscape plugin work counters gate
        run: cargo run -p voxelize-gen --release --features unstable-landscape,kit,gen-counters --example walk_bench -- --fixtures proving --workloads spiral,teleport --workers 1 --gate crates/gen/budgets/proving.json

  # The same generator tests on macOS arm64. The v1 and landscape goldens
  # (tests/golden/) are pinned once and checked here and on Linux x86_64, so
  # the two architectures are compared digest for digest: the bit-stability
  # claim holds only while both pass the same files.
  gen-macos:
    name: cargo test -p voxelize-gen --release (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run generator tests
        run: cargo test -p voxelize-gen --release

      - name: Run landscape tests
        run: cargo test -p voxelize-gen --release --features unstable-landscape,kit,gen-counters

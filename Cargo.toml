[workspace]
members = [".", "crates/core", "crates/gen", "crates/mesher"]
# The wasm mesher builds through wasm-pack with its own profiles and stays a
# standalone workspace.
exclude = ["crates/wasm-mesher"]
resolver = "2"

[package]
description = "A fast multiplayer voxel engine."
edition = "2021"
include = [
  "/server/**/*.rs",
  "/benches/**/*.rs",
  "/build.rs",
  "/messages.proto",
  "/packages/protocol/src/protocol-version.json",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
]
license = "MIT"
name = "voxelize"
repository = "https://github.com/voxelize/voxelize"
version = "3.0.0"

[lib]
name = "voxelize"
path = "server/lib.rs"

[[example]]
name = "demo"
path = "examples/server/main.rs"

[dependencies]
voxelize-core = { path = "crates/core", version = "3.0.0" }
voxelize-mesher = { path = "crates/mesher", version = "3.0.0" }
actix = "0.13.3"
actix-cors = "0.7.0"
actix-files = "0.6.5"
actix-web = "4.5.1"
actix-ws = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros"] }
base64 = "0.22.0"
byteorder = "1.5.0"
crossbeam-channel = "0.5.12"
fastrand = "2.0.2"
hashbrown = { version = "0.14.3", features = ["serde", "rayon"] }
indicatif = "0.17.8"
libflate = "2.0.0"
lz4_flex = "0.11"
kiddo = "4.2"
nalgebra = "0.33.0"
nanoid = "0.4.0"
noise = "0.9.0"
num = "0.4.2"
pprof = { version = "0.14", features = ["flamegraph"], optional = true }
prost = "0.12.4"
rapier3d = { version = "0.21.0", features = ["simd-stable"] }
rayon = "1.10.0"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
specs = { version = "0.20.0", features = ["specs-derive", "serde"] }
splines = { version = "4.3.1", features = ["serde"] }
pathfinding = "4.9.1"

chrono = "0.4.19"
fern = { version = "0.6.2", features = ["colored"] }
lazy_static = "1.4"
log = "0.4.21"
thiserror = "1"
webrtc = "0.11"
bytes = "1.5"

[features]
default = []
profiling = ["pprof"]

[build-dependencies]
prost-build = "0.12.4"

[dev-dependencies]
awc = "3"
criterion = { version = "0.5", features = ["html_reports"] }
kdtree = "0.7"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "test-util"] }

[[bench]]
name = "mesher_bench"
harness = false

[[bench]]
name = "lights_bench"
harness = false

[[bench]]
name = "pathfinding_bench"
harness = false

[profile.release]
opt-level = 3
debug = 2

# Local iteration profile: same opt-level (and therefore the same runtime
# performance) as `release`, but rebuilds are incremental and only line-table
# debug info is emitted, which cuts edit-rebuild times dramatically.
# Use with `cargo run --profile release-dev --example demo` (what `pnpm demo:rs` does).
[profile.release-dev]
inherits = "release"
incremental = true
debug = "line-tables-only"

[profile.bench]
inherits = "release"
